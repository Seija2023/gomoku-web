name: Bug report
description: 报告可复现的功能、兼容性或性能问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请尽量提供最小可复现步骤。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、系统、PC/手机、Standalone 或 GitHub Pages
      placeholder: Chrome 140 / Android 16 / GitHub Pages
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 控制台报错、截图、棋谱、性能数据等
