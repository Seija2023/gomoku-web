name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Architecture lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build standalone page
        run: npm run build
      - name: Run browser smoke test
        run: npm run smoke
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-standalone
          path: dist/gomoku.html
          retention-days: 14
