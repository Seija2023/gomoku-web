name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Build standalone page
        run: npm run build
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-standalone
          path: dist/gomoku.html
