<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe6" />
  <title>五子棋 Gomoku</title>
  <style>
:root {
  --bg: #f4efe6;
  --panel: #fffaf2;
  --ink: #1f1f1f;
  --muted: #766f66;
  --wood: #d7a65d;
  --wood-dark: #8e6535;
  --line: rgba(50, 34, 17, 0.58);
  --shadow: 0 18px 50px rgba(48, 35, 20, 0.14);
}

* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.9), transparent 30%),
    linear-gradient(135deg, #efe7da 0%, #f8f2e9 50%, #eee4d6 100%);
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

button:focus-visible {
  outline: 3px solid rgba(52, 103, 177, .45);
  outline-offset: 2px;
}

.hidden { display: none !important; }

.eyebrow {
  margin: 0 0 8px;
  font-size: 12px;
  letter-spacing: .18em;
  font-weight: 800;
  color: var(--muted);
}

h1 {
  margin: 0;
  font-size: clamp(40px, 7vw, 72px);
  letter-spacing: -0.05em;
  line-height: .95;
}

.subtitle {
  margin: 12px 0 0;
  color: var(--muted);
}


.app {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0 48px;
}

.hero {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: end;
  margin-bottom: 26px;
}

.status-card {
  min-width: 190px;
  padding: 15px 18px;
  border: 1px solid rgba(55, 39, 21, .12);
  background: rgba(255, 250, 242, .78);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(48, 35, 20, .08);
}

.status-label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 7px;
}

.turn-indicator {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 24px;
}

.game-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 285px;
  gap: 24px;
  align-items: start;
}


.stone {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-block;
  flex: 0 0 auto;
}

.stone.black {
  background: radial-gradient(circle at 35% 30%, #555, #171717 55%, #050505);
  box-shadow: inset -3px -4px 8px rgba(0,0,0,.45), 0 2px 4px rgba(0,0,0,.2);
}

.stone.white {
  background: radial-gradient(circle at 35% 30%, #fff, #e5e2dd 70%, #beb8af);
  box-shadow: inset -2px -3px 7px rgba(120,110,100,.25), 0 2px 4px rgba(0,0,0,.16);
  border: 1px solid #cfc8bd;
}

.board-wrap {
  border-radius: 24px;
  padding: 28px;
  background: linear-gradient(145deg, #e1b770, #c99043);
  box-shadow: var(--shadow);
  border: 1px solid rgba(94, 58, 20, .25);
  overflow: hidden;
}

.board {
  position: relative;
  aspect-ratio: 1;
  width: 100%;
  background:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px),
    linear-gradient(145deg, #deb16b, #c99043);
  background-size:
    calc(100% / 14) calc(100% / 14),
    calc(100% / 14) calc(100% / 14),
    100% 100%;
  background-position: 0 0, 0 0, 0 0;
  border: 1px solid rgba(63, 38, 13, .46);
  box-shadow: inset 0 0 20px rgba(98, 57, 20, .13);
  touch-action: manipulation;
}

.cell {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  width: calc(100% / 14);
  aspect-ratio: 1;
  padding: 0;
  margin: 0;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  border-radius: 50%;
  z-index: 2;
}

.cell:disabled { cursor: default; }

.cell:not(:disabled):hover::after,
.cell:not(:disabled):focus-visible::after {
  content: "";
  position: absolute;
  width: 24%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: rgba(40, 30, 20, .2);
}

.star {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  width: clamp(5px, 1.25%, 10px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: rgba(49, 31, 13, .72);
  pointer-events: none;
  z-index: 1;
}

.piece {
  width: 78%;
  aspect-ratio: 1;
  border-radius: 50%;
  position: relative;
  z-index: 3;
  pointer-events: none;
  animation: place .14s ease-out;
}

.piece.black {
  background: radial-gradient(circle at 34% 28%, #666 0%, #222 42%, #050505 79%);
  box-shadow: 0 4px 7px rgba(0,0,0,.33), inset -3px -4px 7px rgba(0,0,0,.42);
}

.piece.white {
  background: radial-gradient(circle at 34% 28%, #fff 0%, #f7f5f1 44%, #d0cac1 100%);
  box-shadow: 0 4px 7px rgba(0,0,0,.18), inset -2px -3px 6px rgba(120,105,90,.2);
  border: 1px solid rgba(110,100,90,.32);
}

.piece.last::after {
  content: "";
  position: absolute;
  width: 23%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #c8422d;
  left: 38.5%;
  top: 38.5%;
}

@keyframes place {
  from { transform: scale(.45); opacity: .25; }
  to { transform: scale(1); opacity: 1; }
}


.thinking-badge {
  margin-left: auto;
  padding: 3px 7px;
  font-size: 11px;
  border-radius: 999px;
  color: #6e5739;
  background: rgba(215, 166, 93, .18);
}

.panel {
  padding: 22px;
  border-radius: 22px;
  background: rgba(255, 250, 242, .88);
  border: 1px solid rgba(55, 39, 21, .12);
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}

.panel-section + .panel-section {
  border-top: 1px solid rgba(55,39,21,.1);
  margin-top: 22px;
  padding-top: 22px;
}

.panel h2 {
  margin: 0 0 14px;
  font-size: 17px;
}

.mode-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 5px;
  border-radius: 14px;
  background: rgba(143, 101, 53, .08);
}

.mode-btn {
  min-height: 40px;
  padding: 8px 10px;
  border-radius: 10px;
  color: #5d564d;
  background: transparent;
  font-weight: 700;
}

.mode-btn.active {
  color: #fff;
  background: #2e2b27;
  box-shadow: 0 4px 12px rgba(40, 36, 31, .16);
}

.helper-text {
  margin: 9px 2px 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.55;
}

.stats {
  display: grid;
  gap: 10px;
}

.stats > div {
  display: flex;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(143, 101, 53, .07);
}

.stats span { color: var(--muted); }

.actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.actions button,
.modal button {
  min-height: 44px;
  padding: 11px 15px;
  border-radius: 12px;
  background: #e6ded3;
  color: #2c2925;
  font-weight: 700;
}

.actions button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button.primary {
  color: white;
  background: #2e2b27;
}

.actions button:not(:disabled):hover,
.modal button:hover,
.mode-btn:hover {
  filter: brightness(.97);
}

.rules p {
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(20, 18, 15, .52);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 10;
}

.modal-card {
  width: min(410px, 100%);
  padding: 30px;
  text-align: center;
  background: #fffaf2;
  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(0,0,0,.25);
}

.modal-card h2 {
  margin: 4px 0 8px;
  font-size: 30px;
}

.modal-card p:not(.eyebrow) {
  color: var(--muted);
  margin: 0 0 22px;
}


@media (max-width: 900px) {
  .game-layout { grid-template-columns: 1fr; }
  .panel {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 22px;
  }
  .panel-section + .panel-section { margin: 0; padding: 0; border-top: 0; }
  .rules { grid-column: 1 / -1; }
}

@media (max-width: 620px) {
  .app { width: min(100% - 18px, 1180px); padding: 20px 0 32px; }
  .hero { align-items: start; flex-direction: column; gap: 18px; }
  .status-card { width: 100%; }
  .board-wrap { padding: 20px; border-radius: 18px; }
  .panel { display: block; }
  .panel-section + .panel-section {
    border-top: 1px solid rgba(55,39,21,.1);
    margin-top: 18px;
    padding-top: 18px;
  }
  .rules { grid-column: auto; }
}

@media (max-width: 390px) {
  .board-wrap { padding: 17px; }
  .app { width: min(100% - 12px, 1180px); }
}


  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">GOMOKU · 15×15</p>
        <h1>五子棋</h1>
        <p id="subtitle" class="subtitle">双人本地对战 · 连成五子即可获胜</p>
      </div>
      <div class="status-card" aria-live="polite">
        <span class="status-label">当前回合</span>
        <div id="turnIndicator" class="turn-indicator">
          <span class="stone black"></span>
          <strong id="turnText">黑棋</strong>
          <span id="thinkingBadge" class="thinking-badge hidden">思考中…</span>
        </div>
      </div>
    </header>

    <section class="game-layout">
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="15乘15五子棋棋盘"></div>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <h2>游戏模式</h2>
          <div class="mode-switch" role="group" aria-label="游戏模式">
            <button id="pvpModeBtn" class="mode-btn active" type="button" aria-pressed="true">双人对战</button>
            <button id="aiModeBtn" class="mode-btn" type="button" aria-pressed="false">人机对战</button>
          </div>
          <p id="modeHint" class="helper-text">两名玩家在同一设备轮流落子。</p>
        </div>

        <div class="panel-section">
          <h2>对局信息</h2>
          <div class="stats">
            <div><span id="blackLabel">黑棋</span><strong id="blackCount">0</strong></div>
            <div><span id="whiteLabel">白棋</span><strong id="whiteCount">0</strong></div>
            <div><span>总手数</span><strong id="moveCount">0</strong></div>
          </div>
        </div>

        <div class="panel-section">
          <h2>操作</h2>
          <div class="actions">
            <button id="undoBtn" type="button">悔棋</button>
            <button id="soundBtn" type="button" aria-pressed="true">音效：开</button>
            <button id="restartBtn" class="primary" type="button">重新开始</button>
          </div>
        </div>

        <div class="panel-section rules">
          <h2>规则</h2>
          <p>黑棋先手。双方轮流落子，横、竖或斜线方向率先连续形成五枚同色棋子的一方获胜。当前版本采用基础自由五子棋规则，不含禁手。</p>
        </div>
      </aside>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal-card">
      <p class="eyebrow">GAME OVER</p>
      <h2 id="resultTitle">黑棋获胜</h2>
      <p id="resultText">恭喜完成五子连线。</p>
      <button id="playAgainBtn" class="primary" type="button">再来一局</button>
    </div>
  </div>

  <script>
(function (G) {
  const Config = {
    SIZE: 15,
    BLACK: 1,
    WHITE: 2,
    MODES: Object.freeze({ PVP: 'pvp', AI: 'ai' }),
    DIRECTIONS: Object.freeze([[1, 0], [0, 1], [1, 1], [1, -1]]),
    STAR_POINTS: Object.freeze([[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]]),
    AI_DELAY_MS: 360,
    RESULT_DELAY_MS: 160,
  };

  G.Config = Object.freeze(Config);
})(window.Gomoku = window.Gomoku || {});


(function (G) {
  const { DIRECTIONS } = G.Config;

  function isInside(board, r, c) {
    const size = board.length;
    return r >= 0 && r < size && c >= 0 && c < size;
  }

  function countDirection(board, r, c, dr, dc, player) {
    let count = 0;
    let nr = r + dr;
    let nc = c + dc;

    while (isInside(board, nr, nc) && board[nr][nc] === player) {
      count += 1;
      nr += dr;
      nc += dc;
    }
    return count;
  }

  function hasWon(board, r, c, player) {
    if (!isInside(board, r, c) || board[r][c] !== player) return false;
    return DIRECTIONS.some(([dr, dc]) => {
      const count = 1
        + countDirection(board, r, c, dr, dc, player)
        + countDirection(board, r, c, -dr, -dc, player);
      return count >= 5;
    });
  }

  function isBoardFull(board) {
    return board.every(row => row.every(cell => cell !== 0));
  }

  G.Rules = Object.freeze({ isInside, countDirection, hasWon, isBoardFull });
})(window.Gomoku = window.Gomoku || {});


(function (G) {
  const { BLACK, WHITE, DIRECTIONS } = G.Config;
  const { isInside, hasWon } = G.Rules;

  function countLine(board, r, c, dr, dc, player) {
    let count = 0;
    let nr = r + dr;
    let nc = c + dc;

    while (isInside(board, nr, nc) && board[nr][nc] === player) {
      count += 1;
      nr += dr;
      nc += dc;
    }

    return {
      count,
      open: isInside(board, nr, nc) && board[nr][nc] === 0,
    };
  }

  function patternScore(length, openEnds) {
    if (length >= 5) return 10_000_000;
    if (length === 4 && openEnds === 2) return 900_000;
    if (length === 4 && openEnds === 1) return 120_000;
    if (length === 3 && openEnds === 2) return 32_000;
    if (length === 3 && openEnds === 1) return 4_000;
    if (length === 2 && openEnds === 2) return 1_100;
    if (length === 2 && openEnds === 1) return 180;
    if (length === 1 && openEnds === 2) return 30;
    return 5;
  }

  function evaluateMove(board, r, c, player) {
    if (!isInside(board, r, c) || board[r][c] !== 0) return -Infinity;
    board[r][c] = player;
    let score = 0;

    try {
      for (const [dr, dc] of DIRECTIONS) {
        const forward = countLine(board, r, c, dr, dc, player);
        const backward = countLine(board, r, c, -dr, -dc, player);
        const length = 1 + forward.count + backward.count;
        const openEnds = Number(forward.open) + Number(backward.open);
        score += patternScore(length, openEnds);
      }
      return score;
    } finally {
      board[r][c] = 0;
    }
  }

  function isWinningMove(board, r, c, player) {
    if (!isInside(board, r, c) || board[r][c] !== 0) return false;
    board[r][c] = player;
    try {
      return hasWon(board, r, c, player);
    } finally {
      board[r][c] = 0;
    }
  }

  function getCandidateMoves(board, moves, radius = 2) {
    const size = board.length;
    if (moves.length === 0) {
      const center = Math.floor(size / 2);
      return [{ r: center, c: center }];
    }

    const set = new Set();
    for (const move of moves) {
      for (let dr = -radius; dr <= radius; dr += 1) {
        for (let dc = -radius; dc <= radius; dc += 1) {
          const r = move.r + dr;
          const c = move.c + dc;
          if (isInside(board, r, c) && board[r][c] === 0) set.add(`${r},${c}`);
        }
      }
    }

    return [...set].map(key => {
      const [r, c] = key.split(',').map(Number);
      return { r, c };
    });
  }

  function chooseMove(board, moves, rng = Math.random) {
    const candidates = getCandidateMoves(board, moves);
    if (candidates.length === 0) return null;

    const winning = candidates.find(({ r, c }) => isWinningMove(board, r, c, WHITE));
    if (winning) return winning;

    const mustBlock = candidates.find(({ r, c }) => isWinningMove(board, r, c, BLACK));
    if (mustBlock) return mustBlock;

    const center = Math.floor(board.length / 2);
    let bestScore = -Infinity;
    let bestMoves = [];

    for (const move of candidates) {
      const attack = evaluateMove(board, move.r, move.c, WHITE);
      const defense = evaluateMove(board, move.r, move.c, BLACK);
      const centerDistance = Math.abs(move.r - center) + Math.abs(move.c - center);
      const centerBonus = Math.max(0, board.length - 1 - centerDistance) * 3;
      const score = attack + defense * 1.12 + centerBonus;

      if (score > bestScore) {
        bestScore = score;
        bestMoves = [move];
      } else if (score === bestScore) {
        bestMoves.push(move);
      }
    }

    const index = Math.min(bestMoves.length - 1, Math.floor(rng() * bestMoves.length));
    return bestMoves[index] || candidates[0] || null;
  }

  G.AI = Object.freeze({ chooseMove, getCandidateMoves, isWinningMove, evaluateMove, patternScore });
})(window.Gomoku = window.Gomoku || {});


(function (G) {
  const { SIZE, BLACK, WHITE, MODES } = G.Config;
  const { hasWon, isBoardFull, isInside } = G.Rules;

  class Game {
    constructor() {
      this.mode = MODES.PVP;
      this.reset();
    }

    reset(mode = this.mode) {
      this.mode = mode;
      this.board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      this.currentPlayer = BLACK;
      this.moves = [];
      this.gameOver = false;
    }

    setMode(mode) {
      if (mode !== MODES.PVP && mode !== MODES.AI) return false;
      if (this.mode === mode) return false;
      this.reset(mode);
      return true;
    }

    play(r, c) {
      if (this.gameOver || !isInside(this.board, r, c) || this.board[r][c] !== 0) {
        return { ok: false };
      }

      const player = this.currentPlayer;
      this.board[r][c] = player;
      this.moves.push({ r, c, player });

      const win = hasWon(this.board, r, c, player);
      const draw = !win && isBoardFull(this.board);
      if (win || draw) {
        this.gameOver = true;
      } else {
        this.currentPlayer = player === BLACK ? WHITE : BLACK;
      }

      return { ok: true, player, win, draw, r, c };
    }

    undo() {
      if (this.moves.length === 0) return 0;
      this.gameOver = false;

      if (this.mode === MODES.AI) {
        const last = this.moves[this.moves.length - 1];
        const steps = last?.player === WHITE && this.moves.length >= 2 ? 2 : 1;
        for (let i = 0; i < steps; i += 1) this.removeLastMove();
        this.currentPlayer = BLACK;
        return steps;
      }

      const last = this.moves[this.moves.length - 1];
      this.removeLastMove();
      this.currentPlayer = last.player;
      return 1;
    }

    removeLastMove() {
      const last = this.moves.pop();
      if (last) this.board[last.r][last.c] = 0;
      return last || null;
    }
  }

  G.Game = Object.freeze({ Game });
})(window.Gomoku = window.Gomoku || {});


(function (G) {
  class AudioManager {
    constructor(storageKey = 'gomoku-sound') {
      this.storageKey = storageKey;
      this.context = null;
      this.enabled = this.loadSetting();
    }

    loadSetting() {
      try {
        return localStorage.getItem(this.storageKey) !== 'off';
      } catch {
        return true;
      }
    }

    saveSetting() {
      try {
        localStorage.setItem(this.storageKey, this.enabled ? 'on' : 'off');
      } catch {
        // Browsers may disable storage in private/file contexts; gameplay is unaffected.
      }
    }

    ensureReady() {
      if (!this.enabled) return null;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!this.context) this.context = new AudioCtx();
      if (this.context.state === 'suspended') this.context.resume().catch(() => {});
      return this.context;
    }

    playTone(frequency, duration, volume = 0.035, delay = 0) {
      const ctx = this.ensureReady();
      if (!ctx || !this.enabled) return;

      const start = ctx.currentTime + delay;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(Math.max(volume, 0.0001), start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start(start);
      oscillator.stop(start + duration);
    }

    playMove(player) {
      this.playTone(player === G.Config.BLACK ? 330 : 420, 0.065, 0.028);
    }

    playWin() {
      [523.25, 659.25, 783.99].forEach((f, i) => this.playTone(f, 0.22, 0.035, i * 0.1));
    }

    playDraw() {
      this.playTone(260, 0.13, 0.03);
      this.playTone(220, 0.18, 0.03, 0.12);
    }

    toggle() {
      this.enabled = !this.enabled;
      this.saveSetting();
      if (this.enabled) {
        this.ensureReady();
        this.playTone(500, 0.055, 0.02);

  G.Audio = Object.freeze({ AudioManager });

(function (G) {
  const { SIZE, BLACK, STAR_POINTS } = G.Config;

  function setBoardPosition(element, r, c) {
    element.style.setProperty('--x', `${(c / (SIZE - 1)) * 100}%`);
    element.style.setProperty('--y', `${(r / (SIZE - 1)) * 100}%`);
  }

  class BoardView {
    constructor(element, onCellClick) {
      this.element = element;
      this.onCellClick = onCellClick;
    }

    render(game, locked = false) {
      this.element.innerHTML = '';

      for (const [r, c] of STAR_POINTS) {
        const star = document.createElement('span');
        star.className = 'star';
        setBoardPosition(star, r, c);
        this.element.appendChild(star);
      }

      const last = game.moves[game.moves.length - 1];
      for (let r = 0; r < SIZE; r += 1) {
        for (let c = 0; c < SIZE; c += 1) {
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cell';
          cell.dataset.row = String(r);
          cell.dataset.col = String(c);
          setBoardPosition(cell, r, c);
          cell.setAttribute('role', 'gridcell');
          cell.setAttribute('aria-label', `第${r + 1}行，第${c + 1}列`);
          cell.disabled = game.gameOver || locked;
          cell.addEventListener('click', () => this.onCellClick(r, c));

          const value = game.board[r][c];
          if (value !== 0) {
            const piece = document.createElement('span');
            piece.className = `piece ${value === BLACK ? 'black' : 'white'}`;
            if (last && last.r === r && last.c === c) piece.classList.add('last');
            cell.appendChild(piece);
          }

          this.element.appendChild(cell);
        }
      }
    }
  }

  G.UI = G.UI || {};
  G.UI.BoardView = BoardView;
})(window.Gomoku = window.Gomoku || {});


(function (G) {
  const { BLACK, MODES } = G.Config;

  class PanelView {
    constructor(doc) {
      this.subtitle = doc.getElementById('subtitle');
      this.turnText = doc.getElementById('turnText');
      this.turnIndicator = doc.getElementById('turnIndicator');
      this.thinkingBadge = doc.getElementById('thinkingBadge');
      this.moveCount = doc.getElementById('moveCount');
      this.blackCount = doc.getElementById('blackCount');
      this.whiteCount = doc.getElementById('whiteCount');
      this.blackLabel = doc.getElementById('blackLabel');
      this.whiteLabel = doc.getElementById('whiteLabel');
      this.undoBtn = doc.getElementById('undoBtn');
      this.soundBtn = doc.getElementById('soundBtn');
      this.restartBtn = doc.getElementById('restartBtn');
      this.pvpModeBtn = doc.getElementById('pvpModeBtn');
      this.aiModeBtn = doc.getElementById('aiModeBtn');
      this.modeHint = doc.getElementById('modeHint');
      this.playAgainBtn = doc.getElementById('playAgainBtn');
      this.modal = doc.getElementById('modal');
      this.resultTitle = doc.getElementById('resultTitle');
      this.resultText = doc.getElementById('resultText');
    }

    bind(handlers) {
      this.undoBtn.addEventListener('click', handlers.undo);
      this.soundBtn.addEventListener('click', handlers.toggleSound);
      this.restartBtn.addEventListener('click', handlers.restart);
      this.playAgainBtn.addEventListener('click', handlers.restart);
      this.pvpModeBtn.addEventListener('click', () => handlers.setMode(MODES.PVP));
      this.aiModeBtn.addEventListener('click', () => handlers.setMode(MODES.AI));
    }

    hideModal() {
      this.modal.classList.add('hidden');
    }

    showResult(game, player) {
      let name;
      if (game.mode === MODES.AI) name = player === BLACK ? '你获胜了' : '电脑获胜';
      else name = player === BLACK ? '黑棋获胜' : '白棋获胜';
      this.resultTitle.textContent = name;
      this.resultText.textContent = `第 ${game.moves.length} 手完成五子连线。`;
      this.modal.classList.remove('hidden');
    }

    showDraw() {
      this.resultTitle.textContent = '平局';
      this.resultText.textContent = '棋盘已满，本局未分胜负。';
      this.modal.classList.remove('hidden');
    }

    updateMode(game) {
      const aiMode = game.mode === MODES.AI;
      this.pvpModeBtn.classList.toggle('active', !aiMode);
      this.aiModeBtn.classList.toggle('active', aiMode);
      this.pvpModeBtn.setAttribute('aria-pressed', String(!aiMode));
      this.aiModeBtn.setAttribute('aria-pressed', String(aiMode));
      this.subtitle.textContent = aiMode
        ? '人机对战 · 你执黑棋，电脑执白棋'
        : '双人本地对战 · 连成五子即可获胜';
      this.modeHint.textContent = aiMode
        ? '你执黑先手；电脑会优先进攻、拦截五连，并根据棋形选择落点。'
        : '两名玩家在同一设备轮流落子。';
      this.blackLabel.textContent = aiMode ? '你（黑棋）' : '黑棋';
      this.whiteLabel.textContent = aiMode ? '电脑（白棋）' : '白棋';
    }

    updateStatus(game, aiThinking, soundEnabled) {
      const blackCount = game.moves.filter(move => move.player === BLACK).length;
      const whiteCount = game.moves.length - blackCount;
      this.blackCount.textContent = String(blackCount);
      this.whiteCount.textContent = String(whiteCount);
      this.moveCount.textContent = String(game.moves.length);
      this.undoBtn.disabled = game.moves.length === 0;

      const stone = this.turnIndicator.querySelector('.stone');
      stone.className = `stone ${game.currentPlayer === BLACK ? 'black' : 'white'}`;
      this.thinkingBadge.classList.toggle('hidden', !aiThinking);

      if (game.gameOver) {
        this.turnText.textContent = '对局结束';
      } else if (game.mode === MODES.AI) {
        this.turnText.textContent = game.currentPlayer === BLACK ? '你 · 黑棋' : '电脑 · 白棋';
      } else {
        this.turnText.textContent = game.currentPlayer === BLACK ? '黑棋' : '白棋';
      }

      this.soundBtn.textContent = `音效：${soundEnabled ? '开' : '关'}`;
      this.soundBtn.setAttribute('aria-pressed', String(soundEnabled));
    }
  }

  G.UI = G.UI || {};
  G.UI.PanelView = PanelView;
})(window.Gomoku = window.Gomoku || {});


(function (G) {
  const { WHITE, MODES, AI_DELAY_MS, RESULT_DELAY_MS } = G.Config;
  const game = new G.Game.Game();
  const audio = new G.Audio.AudioManager();
  const panel = new G.UI.PanelView(document);
  const boardView = new G.UI.BoardView(document.getElementById('board'), handleCellClick);

  let aiThinking = false;
  let aiTimer = null;
  let resultTimer = null;

  function clearTimers() {
    if (aiTimer) clearTimeout(aiTimer);
    if (resultTimer) clearTimeout(resultTimer);
    aiTimer = null;
    resultTimer = null;
    aiThinking = false;
  }

  function refresh() {
    const locked = aiThinking || (game.mode === MODES.AI && game.currentPlayer === WHITE);
    boardView.render(game, locked);
    panel.updateMode(game);
    panel.updateStatus(game, aiThinking, audio.enabled);
  }

  function restart() {
    clearTimers();
    game.reset();
    panel.hideModal();
    refresh();
  }

  function setMode(mode) {
    if (game.mode === mode) return;
    clearTimers();
    game.setMode(mode);
    panel.hideModal();
    refresh();
  }

  function handleCellClick(r, c) {
    if (game.gameOver || aiThinking || game.board[r][c] !== 0) return;
    if (game.mode === MODES.AI && game.currentPlayer === WHITE) return;
    audio.ensureReady();
    performMove(r, c);
  }

  function performMove(r, c) {
    const result = game.play(r, c);
    if (!result.ok) return false;

    audio.playMove(result.player);
    refresh();

    if (result.win) {
      audio.playWin();
      resultTimer = setTimeout(() => {
        resultTimer = null;
        if (game.gameOver) panel.showResult(game, result.player);
      }, RESULT_DELAY_MS);
      return true;
    }

    if (result.draw) {
      audio.playDraw();
      resultTimer = setTimeout(() => {
        resultTimer = null;
        if (game.gameOver) panel.showDraw();
      }, RESULT_DELAY_MS);
      return true;
    }

    if (game.mode === MODES.AI && game.currentPlayer === WHITE) scheduleAiMove();
    return true;
  }

  function scheduleAiMove() {
    aiThinking = true;
    refresh();
    aiTimer = setTimeout(() => {
      aiTimer = null;
      if (game.gameOver || game.mode !== MODES.AI || game.currentPlayer !== WHITE) {
        aiThinking = false;
        refresh();
        return;
      }

      const move = G.AI.chooseMove(game.board, game.moves);
      aiThinking = false;
      if (move) performMove(move.r, move.c);
      else refresh();
    }, AI_DELAY_MS);
  }

  function undo() {
    if (game.moves.length === 0) return;
    clearTimers();
    panel.hideModal();
    game.undo();
    refresh();
  }

  function toggleSound() {
    audio.toggle();
    panel.updateStatus(game, aiThinking, audio.enabled);
  }

  panel.bind({ undo, toggleSound, restart, setMode });
  restart();

  G.App = Object.freeze({
    restart,
    setMode,
    undo,
    getGame: () => game,
  });
})(window.Gomoku = window.Gomoku || {});


  </script>
